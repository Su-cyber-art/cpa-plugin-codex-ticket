# Merge into CPA config; no credentials here.
# Restart CPA after enabling this: it removes error-only raw request logging.
commercial-mode: true
request-log: false
plugins:
  enabled: true
  dir: plugins
  configs:
    codex-ticket:
      enabled: false
      priority: 10
      harvest_enabled: false
      inject_enabled: false
      proxy_file: /CLIProxyAPI/plugins/codex-ticket-private/harvest-proxy.url
      host_config_file: /CLIProxyAPI/config.yaml
      models: gpt-6-astra,gpt-5.6-sol
      target_length: 292
      ttl_seconds: 3600
      refresh_before_seconds: 600
      scan_interval_seconds: 30
      timeout_seconds: 25
      max_concurrency: 1
      retry_base_seconds: 60
      retry_max_seconds: 1800
      replace_existing: false
